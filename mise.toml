[tools]
python = "3.12.14"
uv = "0.12.23"

[tasks.setup]
description = "Install the locked Python environment"
run = "uv sync --locked"

[tasks.check]
description = "Validate sources, lint Python, and run offline regressions"
run = [
  "uv run --locked ruff check .",
  "uv run --locked sentence-db validate-config",
  "uv run --locked pytest -q",
]

[tasks.demo]
description = "Complete offline demo with synthetic sentences"
run = "uv run --locked sentence-db demo"

[tasks.sources]
description = "List reviewed sources without network access"
run = "uv run --locked sentence-db sources"

[tasks.snapshot]
description = "Explicit upstream acquisition; pass --source, --output and optional --mode/--date"
run = "uv run --locked sentence-db snapshot"

[tasks.verify-snapshot]
description = "Verify an existing raw snapshot offline"
run = "uv run --locked sentence-db verify-snapshot"

[tasks.snapshot-pack]
description = "Split raw snapshots into immutable transport parts offline"
run = "uv run --locked sentence-db snapshot-pack"

[tasks.snapshot-unpack]
description = "Restore already downloaded transport parts offline"
run = "uv run --locked sentence-db snapshot-unpack"

[tasks.build]
description = "Build canonical YAML from existing snapshots; never downloads source data"
run = "uv run --locked sentence-db build"

[tasks.select-wikimedia]
description = "Offline balanced article metadata selection from cached Japanese Wikimedia"
run = "uv run --locked sentence-db select-wikimedia"

[tasks.build-db]
description = "Compile canonical YAML to SQLite offline"
run = "uv run --locked sentence-db build-db"

[tasks.package]
description = "Build per-source SQLite and package public YAML ZIP + SQLite Zstandard assets"
run = "uv run --locked sentence-db package"

[tasks.verify-build]
description = "Verify a corpus build offline"
run = "uv run --locked sentence-db verify-build"

[tasks.build-normalized-db]
description = "Compile normalized JSONL ZIP into deduplicated relational SQLite"
run = "uv run --locked sentence-db build-normalized-db"

[tasks.export-normalized]
description = "Export normalized compressed ZIP, optionally selecting reviewed whole works"
run = "uv run --locked sentence-db export-normalized"

[tasks.vocabulary-coverage]
description = "Compare distinct and marginal vocabulary using an explicit analyzer export"
run = "uv run --locked sentence-db vocabulary-coverage"

[tasks.snapshot-tubelex]
description = "Opt-in TUBELEX Japanese manual captions; never part of public corpus snapshots"
run = "uv run --locked sentence-db snapshot-tubelex"

[tasks.build-tubelex]
description = "Offline private citation index beside a downloaded CC corpus release"
run = "uv run --locked sentence-db build-tubelex"

[tasks.search-tubelex]
description = "Private exact-substring search returning only timed YouTube references"
run = "uv run --locked sentence-db search-tubelex"

[tasks.verify-tubelex]
description = "Verify the private citation index and text-free references before activation"
run = "uv run --locked sentence-db verify-tubelex"

[tasks.build-tubelex-batch]
description = "Build/resume immutable private shards from disjoint caption snapshots"
run = "uv run --locked sentence-db build-tubelex-batch"

[tasks.verify-tubelex-collection]
description = "Verify a completed private citation shard collection offline"
run = "uv run --locked sentence-db verify-tubelex-collection"

[tasks.prepare-tubelex-review]
description = "Prepare a compressed private review packet without showing predictions"
run = "uv run --locked sentence-db prepare-tubelex-review"

[tasks.score-tubelex-review]
description = "Compare independent boundary annotations with fixed processing profiles"
run = "uv run --locked sentence-db score-tubelex-review"


[tasks.prepare-tubelex-playback-review]
description = "Prepare text-free clips for an independent listening review"
run = "uv run --locked sentence-db prepare-tubelex-playback-review"

[tasks.score-tubelex-playback-review]
description = "Score explicitly declared listening ratings separately from sentence boundaries"
run = "uv run --locked sentence-db score-tubelex-playback-review"

[tasks.benchmark-tubelex-pipeline]
description = "Measure offline build, warm rebuild and sealed/interrupted resume phases"
run = "uv run --locked python benchmarks/tubelex_pipeline.py"

[tasks.benchmark-tubelex-filter-cache]
description = "Stress default bounded filter-cache working sets with synthetic byte fixtures"
run = "uv run --locked python benchmarks/tubelex_filter_cache.py"
