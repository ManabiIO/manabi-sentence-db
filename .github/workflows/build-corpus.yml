name: Build corpus from snapshot (manual)

on:
  workflow_dispatch:
    inputs:
      snapshot_release:
        description: Published raw snapshot release tag in this repository (drafts are inaccessible)
        required: true
        type: string
      catalog_sha256:
        description: Exact SHA-256 printed by the snapshot workflow (pins its source inputs)
        required: true
        type: string
      runner:
        description: Full Wikipedia requires a provisioned self-hosted Linux sentence-db runner
        type: choice
        options: [ubuntu-24.04, self-hosted]
        default: ubuntu-24.04
      create_draft_release:
        description: Create a draft corpus release after building and packaging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sentence-db-build-${{ github.ref }}-${{ inputs.snapshot_release }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "linux", "sentence-db"]') || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.runner == 'self-hosted' && 1380 || 350 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - name: Restore pinned input bytes from the snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT_RELEASE: ${{ inputs.snapshot_release }}
          CATALOG_SHA256: ${{ inputs.catalog_sha256 }}
          RUNNER_KIND: ${{ inputs.runner }}
        run: |
          uv run --locked python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from manabi_sentence_db.snapshot import safe_filename
          from manabi_sentence_db.transport import snapshot_unpack

          tag, expected = os.environ['SNAPSHOT_RELEASE'], os.environ['CATALOG_SHA256']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,127}', tag):
              raise SystemExit('Invalid snapshot release tag')
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('catalog_sha256 must be 64 lowercase hexadecimal characters')
          release = subprocess.run(['gh', 'release', 'view', tag, '--json', 'isDraft'],
                                   capture_output=True, text=True, check=False)
          if release.returncode or json.loads(release.stdout).get('isDraft') is not False:
              raise SystemExit('The snapshot release is unavailable to this read-only workflow. Review and publish the raw snapshot release first, then verify the tag belongs to this repository. Draft snapshots are not supported here; local builds can use their downloaded bundles.')
          downloaded = Path('data/downloaded-snapshot')
          downloaded.mkdir(parents=True)
          command = ['gh', 'release', 'download', tag, '--dir', str(downloaded)]
          subprocess.run(command + ['--pattern', 'snapshot-catalog.json'], check=True)
          catalog_bytes = (downloaded / 'snapshot-catalog.json').read_bytes()
          if hashlib.sha256(catalog_bytes).hexdigest() != expected:
              raise SystemExit('Snapshot catalog digest mismatch')
          catalog = json.loads(catalog_bytes)
          if catalog.get('schema_version') != 1 or catalog.get('kind') != 'snapshot-catalog' or not catalog.get('snapshots'):
              raise SystemExit('Unsupported or empty snapshot catalog')
          entries = catalog['snapshots']
          if os.environ['RUNNER_KIND'] != 'self-hosted' and any(row['source_id'] == 'wikipedia-ja' and row['mode'] != 'sample' for row in entries):
              raise SystemExit('Wikipedia bulk snapshots, including partial chunks, require the self-hosted sentence-db runner or a local build')
          if len({row['source_id'] for row in entries}) != len(entries):
              raise SystemExit('Duplicate source in snapshot catalog')
          for row in entries:
              safe_filename(row['source_id'])
              name = safe_filename(row['path'])
              if not name.endswith('.bundle.json'):
                  raise SystemExit('Unexpected snapshot bundle filename')
              subprocess.run(command + ['--pattern', name], check=True)
              if hashlib.sha256((downloaded / name).read_bytes()).hexdigest() != row['sha256']:
                  raise SystemExit('Snapshot bundle digest mismatch')
          subprocess.run(command + ['--pattern', '*.part'], check=True)
          manifests = []
          for row in entries:
              path = snapshot_unpack(downloaded / row['path'], Path('data/restored') / row['source_id'])
              manifest = json.loads(path.read_text())
              if manifest['snapshot_id'] != row['snapshot_id'] or manifest['source_id'] != row['source_id'] or manifest['mode'] != row['mode']:
                  raise SystemExit('Restored snapshot disagrees with catalog')
              manifests.append(str(path))
          Path('build-inputs.txt').write_text('\n'.join(manifests) + '\n')
          PY
      - name: Build canonical YAML and package SQLite offline
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          command = ['uv', 'run', '--locked', 'sentence-db', 'build', '--output', 'build/corpus']
          for manifest in Path('build-inputs.txt').read_text().splitlines():
              command += ['--snapshot', manifest]
          subprocess.run(command, check=True)
          subprocess.run(['uv', 'run', '--locked', 'sentence-db', 'package', '--build', 'build/corpus', '--output', 'dist/corpus'], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentence-corpus
          path: dist/corpus/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  draft-release:
    if: inputs.create_draft_release
    needs: build
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "linux", "sentence-db"]') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sentence-corpus
          path: corpus-release
      - name: Create a new draft corpus release without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: corpus-${{ github.run_id }}-${{ github.run_attempt }}
          SNAPSHOT_RELEASE: ${{ inputs.snapshot_release }}
          CATALOG_SHA256: ${{ inputs.catalog_sha256 }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          root = Path('corpus-release')
          files = sorted(path for path in root.iterdir() if path.is_file())
          if not files or len(files) > 1000 or any(path.stat().st_size >= 2 * 1024**3 for path in files):
              raise SystemExit('Invalid release asset inventory')
          if not (root / 'release.json').is_file():
              raise SystemExit('The corpus artifact is missing its release manifest')
          if any(path.is_dir() for path in root.iterdir()):
              raise SystemExit('Expected a flat release asset directory')
          notes = Path('corpus-notes.md')
          notes.write_text(f'Processed sentence corpus. Consult the included catalog and attribution before reuse.\n\nCode: `{os.environ["GITHUB_SHA"]}`\n\nSnapshot: `{os.environ["SNAPSHOT_RELEASE"]}`\n\nInput catalog SHA-256: `{os.environ["CATALOG_SHA256"]}`\n')
          tag = os.environ['RELEASE_TAG']
          subprocess.run(['gh', 'release', 'create', tag, '--target', os.environ['GITHUB_SHA'],
                          '--title', tag, '--notes-file', str(notes), '--draft', '--latest=false'], check=True)
          subprocess.run(['gh', 'release', 'upload', tag, *map(str, files)], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## Corpus release draft\n\nTag: `{tag}`\n')
          PY
