notes:
  - Publisher manually translated Japanese Wikipedia; Japanese-native primary translators, English-native revision, then Japanese-native terminology checks. The README forbids use of machine translation systems. This is human translation, not machine translation with human review.
  - Import only final check/ver=1 English pairs, never title/section translations or translator comments. Publisher pair units remain intact so translations are not falsely assigned to smaller fragments.
  - Historical subjects do not establish archaic language. Exclude incomplete prose and Japanese quotation/title spans conservatively; apply shared modern-text, content and Wikipedia density policies as well.
  - Each article retains its exact raw XML hash, original dump ID, supplied contributor notice and Wikipedia page/history URL. Dump dates are not article publication dates or page revision IDs.
  - The published archive contains one invalid XML entity in a contributor name in GNM/GNM00155.xml. Only that exact member hash and exact byte sequence have a reviewed serialization repair; decoded attribution retains the literal ampersand. Any other malformed XML fails closed.
  - KFTT is derived from this source; do not count it as an independent corpus or import it again.
  - Paragraph and section breaks were detected automatically and are approximate. Source ordinal gaps remain after filtering.
