notes:
  - Japanese originals and human English translations; the paper describes translation by a Japanese undergraduate and checking by a native British English speaker. This is publisher workflow evidence, not per-record native review or project quality certification.
  - Preserve deliberate Japanese bunsetsu spaces and explicit publisher sentence IDs. Each row is an independent work, never neighboring dialogue context. Ordinary sentence and content-quality gates apply.
  - Import only raw Japanese and original British English files; exclude the US adaptation, audio, tokenizations and annotations. No serving activation is implied.
