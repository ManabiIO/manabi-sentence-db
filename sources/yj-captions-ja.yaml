notes:
  - Human original Japanese crowdsourced and cleaned captions, not translations or parallel English.
  - Each caption is an independent work, including captions sharing an image ID.
  - Only captions with terminal sentence punctuation are retained; source text is not rewritten.
  - Visual context is unavailable. No image metadata, URLs, images, or image-license data are imported; image rights are separate.
