  speakers according to collection documentation. No sentence-level native review
  is claimed.
- Exclude SCUDs, supplemental/vanilla examples, scenario requirements, profiles and
  timestamps.
- Publisher NFKC/tab transformations and typo edits predate ingestion. Any text_fixed
  field fails closed pending review. text_sbs is not used; project splitting retains
  source utterance provenance.
- 210 dialogues is an inventory count, not a usable sentence or novelty count.
