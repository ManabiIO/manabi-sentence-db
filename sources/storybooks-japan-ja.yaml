notes:
- Explicitly selected, commit/hash-pinned Japanese story HTML only; per-work license
  is read from that exact page, not inferred from repository software licensing.
- The two source manifests separate CC BY 3.0 and CC BY 4.0 works. Eleven noncommercial
  works in the 40-story catalog are excluded.
- Text is Japanese translation/adaptation; original source language, generation method
  and native-speaker review remain unknown. Contributor names and publisher editorial
  workflow do not establish per-record review.
- Reading levels are publisher labels, not JLPT estimates. Sentence review_state remains
  unreviewed; publication dates are not inferred from Git timestamps.
- Only primary Japanese page columns are read; duplicate language columns, navigation,
  titles, images and audio are excluded. Original page units and gaps survive sentence
  segmentation.
- The website wrapper is MIT-licensed; its pinned LICENSE is retained separately as
  snapshot evidence and never emitted as sentence text.
- The mixed-license research ZIP is not a redistributable snapshot. Acquisition downloads
  only the explicitly eligible HTML files and the site MIT license.
