notes:
  - Each spreadsheet row is one independent sentence-pattern example; row order is not conversational or discourse adjacency.
  - Japanese was automatically extracted from Kyoto University case frames and human corrected; the source does not identify individual sentence authors.
  - English and Chinese translations are aligned row by row. The primary source does not specify whether each translation was produced by a human or machine, so translation method is unknown.
  - The source defines X as a noun phrase or clause placeholder and ～ as a quotation placeholder; numeric ranges such as 2～3 are ordinary text. Rows with unresolved X/quotation placeholders are excluded; numeric ranges are retained.
  - Translations retain separate NICT attribution and CC BY 3.0 rights.
  - Kyoto University notes that some English translations were corrected in v1.3 on 2020-03-28; this source pins that v1.3 release.
