notes:
  - "JaQuAD 0.1.0 train and validation splits only: 31,748 and 3,939 questions. The 4,009-question test set is not published upstream."
  - Only exact human-curated Japanese question strings are emitted as one independent question per work; article titles, Wikipedia contexts, answers, answer spans, and translations are excluded.
  - Authorship is human per the publisher and paper. Language origin is unknown; no native-speaker or translation claim is made.
  - Question type is retained as a descriptive tag. Duplicate question text is not removed; exact text hashes and independent source IDs allow corpus deduplication while retaining occurrences.
  - The raw snapshot contains excluded Wikipedia contexts and answer annotations as upstream source evidence. Raw snapshot bundle publication is disabled; publish processed question-only corpus exports.
  - Stratified review across all five publisher question types found mostly understandable independent questions, with occasional context-dependent references and visible defects such as a typo or repeated punctuation. Original wording is preserved rather than silently corrected.
