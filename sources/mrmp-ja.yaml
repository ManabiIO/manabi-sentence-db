notes:
  - Human Japanese chat turns only. Never import participant profiles, interpersonal relationships, evaluations or model outputs.
  - The pinned publisher tree has 960 dialogue files (477 first-time and 483 family-included); its README reports 100680 utterances. These are publisher counts, not admitted sentence or novelty counts.
  - Short conversational turns can depend on context. Preserve turn IDs and gaps; exclude masked personal information through the ordinary build gate. Do not rewrite mentions or names into invented prose.
  - Current primary GitHub README and LICENSE grant CC BY-SA 4.0. The Hugging Face loader still labels an older tag BY-ND; do not substitute its tag or license string for this exact reviewed primary revision.
  - No translation or native-review annotations are supplied or invented. Occurrences remain unreviewed.
