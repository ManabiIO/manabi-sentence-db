notes:
  - The publisher's NOTICE explicitly licenses the dataset under CC BY 4.0. The repository's Apache 2.0 software license is separate. The archive retains its own data LICENSE and inherited SLURP attribution notice.
  - Japanese was human localized from English SLURP requests. Keep this translated origin explicit; do not label it original Japanese or machine generated.
  - Require at least two distinct reviewers other than the localization worker, all with grammar score at least 3, spelling score 2, positive intent/slots judgments and target-language identification. These are publisher judgments, not Manabi or native-speaker certification. Occurrences remain unreviewed.
  - Import Japanese utt only. Exclude annotations, worker identifiers, raw judgments and all other locales. English seed prompts may contain different localized entities, so do not expose them as translations.
  - Each independent request is its own work. Never fabricate conversational neighbors from consecutive dataset IDs.
