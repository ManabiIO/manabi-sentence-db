notes:
  - Publisher README grants CC BY 4.0. Paper section 3.2 documents Japanese utterances and verbal responses authored by crowdworkers, distinct from model-generated evaluation output.
  - Each TSV row is an independent two-turn prompt/response pair. Repeated image, gaze and utterance fields do not make separate candidate responses consecutive conversation turns.
  - Keep only spoken units with terminal sentence punctuation, followed by the shared content and text-quality checks. Preserve omitted-turn gaps and exact text. Punctuation does not establish complete grammar, visual independence or native-speaker review.
  - Never import non_verbal_response as spoken Japanese. Do not download images, execute publisher code, infer translations, or claim these hypothetical crowdwritten conversations were recorded speech.
  - Visual references and colloquial forms remain. All imported occurrences are unreviewed; assistant development inspection is not native-speaker certification.
