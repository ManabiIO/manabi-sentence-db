  unknown with explicit translation tags. English alignment is original source text,
  not a translation from Japanese.
- Preserve exact SNT identities including split suffixes, publisher row order, missing-row
  gaps, and English article URLs. Corpus timestamps are not article publication dates.
- Conservatively exclude quotation-bearing pairs and incomplete Japanese. Do not activate
  automatically.
