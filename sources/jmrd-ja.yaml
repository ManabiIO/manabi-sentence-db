notes:
  - Human authored Japanese dialogue only. Never export external movie knowledge, plots, reviews, questionnaires, or model output.
  - Recommender turns require explicit grounding limited to no-knowledge or the reviewed factual title/year/director/cast/genre types. External-prose-grounded or unannotated recommender turns are withheld whole.
  - Both roles are screened for long literal overlap with bundled external prose. This is a conservative source-specific gate, not a general copyright classifier or naturalness certification.
  - Addressed turns and all withheld turns preserve context gaps. Text is not repaired. Imported occurrences remain unreviewed and no translation metadata is invented.
  - Raw snapshots contain excluded external material and are local processing evidence only. Publish processed normalized corpus archives, never the raw research snapshot.
